defaults:
  - default

# Number of views parameter for the multi-view datasets
num_views: 4

train:
  # If True, the number of views can vary from batch to batch. The maximum number of views is num_views and minimum is 2. (On by default for N-view training)
  variable_num_views: false

# Train Resolution
resolution_train: ${dataset.resolution_options.518_many_ar_fisheye}

# Validation Resolution
resolution_val_tartanground: ${dataset.resolution_options.518_1_00_ar_fisheye}

# Training Set
train_dataset:
  "1_000_000 @ ${dataset.tartanground.train.dataset_str}"
# Validation Set
test_dataset:
  "${dataset.tartanground.val.dataset_str}"
