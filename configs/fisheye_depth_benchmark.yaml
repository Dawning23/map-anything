defaults:
  - machine: huoshan
  - model: fisheyemapanything_dino_init_small
  - dataset: tartan_ground_fisheye
  - _self_

output_dir: ${hydra:run.dir}
root_data_dir: ${machine.root_data_dir}
mapanything_dataset_metadata_dir: ${machine.mapanything_dataset_metadata_dir}
root_pretrained_checkpoints_dir: ${machine.root_pretrained_checkpoints_dir}
root_experiments_dir: ${machine.root_experiments_dir}
root_uniception_pretrained_checkpoints_dir: ${machine.root_uniception_pretrained_checkpoints_dir}

### Benchmarking args
seed: 0
disable_cudnn_benchmark: true
batch_size: 10
amp: 1
amp_dtype: "bf16"
# Distance bin size in meters for per-distance evaluation
distance_bin_size: 5
# Maximum distance in meters (points beyond this are grouped into the last bin)
max_distance: 50
# Whether to save visualization PLY files (GT + pred inlier + pred error-colored)
save_vis: true
# Delta threshold for inlier filtering in PLY visualization (max(pred/gt, gt/pred) < this)
vis_delta_threshold: 1.25
# Max number of samples per scene to save as PLY (to avoid excessive disk usage)
vis_max_samples: 5

### Geometric input conditioning for inference
# Whether to provide GT camera intrinsics (ray_directions_cam) as model input
use_calibration: false
# Whether to provide GT camera poses as model input
use_pose: false
# Whether to provide metric scale info for depth input
use_depth_scale: false
# Whether to provide metric scale info for pose input
use_pose_scale: false
